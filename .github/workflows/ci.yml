name: kprotect CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Linting (fmt & clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Lints)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (for eBPF dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev libbpf-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run Units Tests
        run: cargo test --workspace --verbose

  build_ebpf:
    name: Build eBPF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src -c clippy
          rustup default stable

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Cache Cargo (eBPF)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kprotect-ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('kprotect-ebpf/Cargo.lock') }}

      - name: Build eBPF programs
        run: cargo xtask build-ebpf --release

  build_gui:
    name: Build GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: kprotect-ui/package-lock.json

      - name: Install Dependencies
        run: |
          cd kprotect-ui
          npm ci

      - name: Build Frontend
        run: |
          cd kprotect-ui
          npm run build

  package:
    name: Create Debian Package
    runs-on: ubuntu-latest
    needs: [test, build_ebpf, build_gui]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Release Binaries
        run: cargo build --release

      - name: Build Debian Package
        run: |
          cd kprotect-daemon
          cargo deb --no-build --output ../target/kprotect.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kprotect-deb
          path: target/kprotect.deb
